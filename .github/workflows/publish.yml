name: Publish container image

on:
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/publish.yml'
      - 'Dockerfile'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'src/**'

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: azacmecertrenewal
  IMAGE_VERSION: 1.${{ github.run_number }}.0

jobs:
  publish:
    name: Publish latest image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: container-latest
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image repository name
        id: image
        run: |
          echo "repository=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish latest image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ steps.image.outputs.repository }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ steps.image.outputs.repository }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/${{ steps.image.outputs.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Tag published image version
        env:
          TAG_NAME: ${{ env.IMAGE_VERSION }}
        run: |
          remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"

          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" = "$GITHUB_SHA" ]; then
              echo "Tag ${TAG_NAME} already points to ${GITHUB_SHA}."
              exit 0
            fi

            echo "::error::Tag ${TAG_NAME} already exists at ${remote_sha}, expected ${GITHUB_SHA}."
            exit 1
          fi

          git tag "${TAG_NAME}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG_NAME}"